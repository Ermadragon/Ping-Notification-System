version: '3.8'

services:

  sqlserver_user:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "yourStrong(!)Password"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data_user:/var/opt/mssql
    container_name: sqlserver_user

  sqlserver_notification:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "yourStrong(!)Password"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - sql_data_notification:/var/opt/mssql
    container_name: sqlserver_notification

  sqlserver_recommendation:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "yourStrong(!)Password"
      ACCEPT_EULA: "Y"
    ports:
      - "1435:1433"
    volumes:
      - sql_data_recommendation:/var/opt/mssql
    container_name: sqlserver_recommendation

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  user_service:
    build: ./user_service
    ports:
      - "5001:5001"
    depends_on:
      - sqlserver_user
    environment:
      FLASK_APP: app
      FLASK_RUN_PORT: 5001

  notification_service:
    build: ./notification_service
    ports:
      - "5002:5002"
    depends_on:
      - sqlserver_notification
      - kafka
    environment:
      FLASK_APP: app
      FLASK_RUN_PORT: 5002

  recommendation_service:
    build: ./recommendation_service
    ports:
      - "5003:5003"
    depends_on:
      - sqlserver_recommendation
      - kafka
    environment:
      FLASK_APP: app
      FLASK_RUN_PORT: 5003

  graphql_gateway:
    build: ./graphql_gateway
    ports:
      - "5000:5000"
    depends_on:
      - user_service
      - notification_service
      - recommendation_service
    environment:
      FLASK_APP: app
      FLASK_RUN_PORT: 5000

volumes:
  sql_data_user:
  sql_data_notification:
  sql_data_recommendation:
